name: Ping
on: workflow_dispatch
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/github-script@v7
      with:
        script: |
          const html = '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Test</title></head><body><h1>UPDATED NOW</h1></body></html>';
          await github.rest.repos.createOrUpdateFileContents({
            owner: context.repo.owner,
            repo: context.repo.repo,
            path: 'index.html',
            message: 'auto update',
            content: Buffer.from(html).toString('base64'),
            branch: 'main'
          });
