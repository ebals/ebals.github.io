name: ForceUpdate
on: workflow_dispatch
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
    - run: |
        CONTENT=$(echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Test</title></head><body><h1>UPDATED NOW</h1><p>'$(date)'</p></body></html>' | base64 -w 0)
        curl -s -X PUT \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          https://api.github.com/repos/${{ github.repository }}/contents/index.html \
          -d "{\"message\":\"auto update\",\"content\":\"$CONTENT\",\"branch\":\"main\"}"
