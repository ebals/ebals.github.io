name: AutoUpdate
on: workflow_dispatch
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
    - run: echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Test</title></head><body><h1>WORKS NOW</h1></body></html>' > index.html
    - run: |
        CONTENT=$(base64 -w 0 index.html)
        curl -s -X PUT \
          -H "Accept: application/vnd.github.v3+json" \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          https://api.github.com/repos/${{ github.repository }}/contents/index.html \
          -d "{\"message\":\"Auto update $(date +%s)\",\"content\":\"$CONTENT\"}"
