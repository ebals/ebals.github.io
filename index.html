<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EBAL'S</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
        body { background-color: #f0f2f5; line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 50px 0; background-color: #2c3e50; color: white; margin-bottom: 30px; border-radius: 10px; }
        .contacts { background: white; padding: 30px; border-radius: 10px; margin-bottom: 30px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .contact-list { list-style: none; }
        .contact-list li { margin: 10px 0; display: flex; align-items: stretch; position: relative; }
        .contact-list i { font-size: 24px; width: 60px; min-width: 60px; text-align: center; color: #2c3e50; background-color: rgba(44, 62, 80, 0.1); display: flex; align-items: center; justify-content: center; border-radius: 5px 0 0 5px; z-index: 1; }
        .contact-btn { display: block; width: 100%; padding: 15px; border: 1px solid #ddd; border-left: none; border-radius: 0 5px 5px 0; color: #2c3e50; text-decoration: none; transition: all 0.3s ease; font-weight: 500; background-color: #f8f9fa; margin-left: -1px; position: relative; flex-grow: 1; }
        .contact-btn:hover { background-color: #2c3e50; color: white; transform: translateY(-2px); box-shadow: 0 2px 5px rgba(0,0,0,0.1); z-index: 2; }
        .contact-btn:hover i { color: white; background-color: rgba(255, 255, 255, 0.1); }
        .contact-form { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; color: #333; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 16px; }
        button[type="submit"] { width: 100%; background-color: #2c3e50; color: white; padding: 15px; border: none; border-radius: 5px; cursor: pointer; font-size: 18px; transition: all 0.3s ease; }
        button[type="submit"]:hover { background-color: #1a252f; transform: translateY(-2px); }
        .hidden { display: none; }
        #success-message { color: #000080; margin-top: 20px; text-align: center; font-weight: bold; }
        @media (max-width: 768px) {
            .container { padding: 10px; }
            header { padding: 30px 0; }
            .contact-list i { width: 50px; min-width: 50px; font-size: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>EBAL'S</h1>
            <p>Expert Business Analytics Legal Solutions</p>
        </header>
        <section class="contacts">
            <h2>CONTACTS</h2>
            <ul class="contact-list">
                <li>
                    <i class="fas fa-envelope"></i>
                    <a href="mailto:ebals@ebals.slmail.me" class="contact-btn">Email</a>
                </li>
                <li>
                    <i class="fab fa-telegram"></i>
                    <a href="https://t.me/EBAL_S" target="_blank" class="contact-btn">Telegram</a>
                </li>
            </ul>
        </section>
        <section class="contact-form">
            <h2>CONTACT EBAL'S</h2>
            <form id="myForm" action="https://formspree.io/f/mwplpkrv" method="POST">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>
                <button type="submit">Submit</button>
            </form>
            <div id="success-message" class="hidden">The message has been successfully sent!<br></div>
        </section>
    </div>
    <script>
        document.getElementById('myForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const form = e.target;
            const formData = new FormData(form);
            const successMessage = document.getElementById('success-message');
            fetch(form.action, {
                method: 'POST',
                body: formData,
                headers: { 'Accept': 'application/json' }
            })
            .then(response => {
                if (response.ok) {
                    successMessage.classList.remove('hidden');
                    form.reset();
                    setTimeout(() => { successMessage.classList.add('hidden'); }, 3000);
                } else {
                    alert('Произошла ошибка при отправке формы');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Произошла ошибка при отправке формы');
            });
        });
    </script>
</body>
</html>
